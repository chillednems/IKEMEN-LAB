plugins { id 'com.android.application' }

def signingVariableNames = [
    'IKEMEN_RELEASE_STORE_FILE',
    'IKEMEN_RELEASE_KEY_ALIAS',
    'IKEMEN_RELEASE_STORE_PASSWORD',
    'IKEMEN_RELEASE_KEY_PASSWORD'
]
def missingSigningVariables = signingVariableNames.findAll { !System.getenv(it) }
def releaseStorePath = System.getenv('IKEMEN_RELEASE_STORE_FILE')
def releaseStore = releaseStorePath ? new File(releaseStorePath) : null

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'packageRelease' }) {
        if (!missingSigningVariables.isEmpty()) {
            throw new GradleException("Release signing requires: ${missingSigningVariables.join(', ')}")
        }
        if (!releaseStore.isAbsolute() || !releaseStore.isFile()) {
            throw new GradleException('IKEMEN_RELEASE_STORE_FILE must name an existing absolute keystore file')
        }
    }
}

android {
    namespace 'com.chillednems.ikemenlab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.chillednems.ikemenlab'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (missingSigningVariables.isEmpty()) {
                storeFile releaseStore
                storePassword System.getenv('IKEMEN_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('IKEMEN_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('IKEMEN_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
